<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>产品经理应用预览</title>
    <style>
      :root {
        color: #292929;
        background: #f5f5f5;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }
      body { min-width: 1180px; min-height: 100vh; margin: 0; background: #f5f5f5; }
      button { font: inherit; }

      .top-user-bar {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid #e8e8e8;
        background: #ffffff;
      }

      .brand-lockup, .user-summary, .application-identity, .application-actions, .secondary-nav, .tab-list, .toolbar-actions, .field-list {
        display: flex;
        align-items: center;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: #292929;
        color: #ffffff;
        font-size: 13px;
        font-weight: 800;
      }

      .brand-copy { margin-left: 9px; }
      .brand-copy strong, .application-identity strong { display: block; font-size: 14px; line-height: 18px; }
      .brand-copy span, .application-identity span, .user-summary span { display: block; color: #909197; font-size: 11px; line-height: 16px; }
      .user-avatar {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        margin-left: 9px;
        border: 1px solid #e5e7eb;
        border-radius: 50%;
        background: #f2f3f5;
        color: #4b5563;
        font-size: 12px;
        font-weight: 700;
      }

      .application-primary-nav {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid #ebebeb;
        background: #ffffff;
      }

      .application-logo {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        margin-right: 10px;
        border-radius: 10px;
        background: #eaf0ff;
        color: #2652f1;
        font-size: 15px;
        font-weight: 800;
      }

      .application-identity strong { font-size: 16px; line-height: 22px; }
      .tier-tag { margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: #f1f3f5; color: #6b7280; font-size: 11px; line-height: 16px; font-weight: 700; }
      .header-action { margin-left: 18px; border: 0; background: transparent; color: #6b7280; cursor: default; font-size: 12px; }

      .application-secondary-nav {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
        border-bottom: 1px solid #e8e8e8;
        background: #f8f8f8;
      }

      .module-select {
        min-width: 168px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid #dedede;
        border-radius: 7px;
        background: #ffffff;
        color: #292929;
        cursor: pointer;
        text-align: left;
        font-size: 13px;
        font-weight: 700;
      }

      .tab-list { height: 100%; gap: 4px; overflow: hidden; }
      .tab-button {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: #70747b;
        cursor: pointer;
        white-space: nowrap;
        font-size: 13px;
      }
      .tab-button[aria-selected="true"] { border-bottom-color: #2652f1; color: #2652f1; font-weight: 700; }

      .page-canvas { min-height: calc(100vh - 172px); padding: 12px 24px 28px; }
      .update-action-row {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
      }
      .page-context h1 { margin: 0; font-size: 16px; line-height: 22px; }
      .page-context p { margin: 2px 0 0; color: #909197; font-size: 12px; line-height: 18px; }
      .toolbar-actions { gap: 8px; }
      .secondary-button, .primary-button {
        height: 32px;
        padding: 0 13px;
        border-radius: 16px;
        cursor: pointer;
        font-size: 13px;
      }
      .secondary-button { border: 1px solid #dedede; background: #ffffff; color: #4b5563; }
      .primary-button { border: 1px solid #2652f1; background: #2652f1; color: #ffffff; }

      .metric-strip {
        min-height: 84px;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid #e8e8e8;
        border-radius: 8px;
        background: #ffffff;
      }
      .metric-item { min-width: 0; padding: 14px 16px; border-right: 1px solid #eeeeee; }
      .metric-item:last-child { border-right: 0; }
      .metric-label { display: block; color: #909197; font-size: 12px; line-height: 18px; }
      .metric-value { display: block; margin-top: 4px; color: #292929; font-size: 22px; line-height: 26px; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .query-toolbar {
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .filter-list { display: flex; gap: 8px; }
      .filter-chip { height: 32px; padding: 0 11px; border: 1px solid #dedede; border-radius: 16px; background: #ffffff; color: #555b64; font-size: 12px; line-height: 30px; }
      .search-placeholder { width: 300px; height: 32px; padding: 0 12px; border-radius: 16px; background: #ebebeb; color: #969aa1; font-size: 12px; line-height: 32px; }

      .content-surface {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 12px;
      }
      .record-surface, .context-panel { border: 1px solid #e8e8e8; border-radius: 8px; background: #ffffff; }
      .record-surface { overflow: hidden; }
      .record-head, .record-row { display: grid; grid-template-columns: minmax(160px, 1.3fr) repeat(3, minmax(120px, 1fr)) 120px; gap: 12px; align-items: center; padding: 0 16px; }
      .record-head { height: 36px; background: #f7f7f8; color: #777b82; font-size: 12px; }
      .record-row { min-height: 68px; border-top: 1px solid #f0f0f0; color: #4b5058; font-size: 13px; }
      .record-row strong { color: #292929; }
      .record-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .status-dot { display: inline-flex; align-items: center; gap: 6px; color: #5b6572; }
      .status-dot::before { width: 7px; height: 7px; content: ""; border-radius: 50%; background: #31a866; }
      .context-panel { padding: 16px; }
      .context-panel h2 { margin: 0; font-size: 14px; line-height: 20px; }
      .context-panel p { margin: 6px 0 0; color: #6f747c; font-size: 12px; line-height: 19px; }
      .field-list { flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .field-chip { padding: 4px 8px; border-radius: 5px; background: #f5f7fa; color: #5d6570; font-size: 12px; line-height: 17px; }
      .pending-list { margin: 16px 0 0; padding: 0; list-style: none; }
      .pending-list li { position: relative; padding: 7px 0 7px 14px; border-bottom: 1px solid #f0f0f0; color: #7b5b18; font-size: 12px; line-height: 18px; }
      .pending-list li::before { position: absolute; left: 0; color: #e6a23c; content: "•"; }

      .preview-overlay[hidden] { display: none; }
      .preview-overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: rgba(27, 31, 36, 0.34); }
      .preview-dialog { width: min(720px, calc(100vw - 48px)); max-height: min(680px, calc(100vh - 48px)); overflow: auto; border-radius: 8px; background: #ffffff; box-shadow: 0 20px 56px rgba(20, 25, 35, 0.22); }
      .dialog-head, .dialog-foot { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
      .dialog-head { border-bottom: 1px solid #ededed; }
      .dialog-head h2 { margin: 0; font-size: 16px; line-height: 22px; }
      .close-button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: #f2f3f5; color: #5e6570; cursor: pointer; font-size: 16px; }
      .dialog-body { padding: 20px; }
      .dialog-body p { margin: 0 0 14px; color: #69707a; font-size: 13px; line-height: 21px; }
      .dialog-foot { gap: 8px; justify-content: flex-end; border-top: 1px solid #ededed; }

      @media (max-width: 1280px) {
        body { min-width: 1024px; }
        .content-surface { grid-template-columns: minmax(0, 1fr) 244px; }
        .metric-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .metric-item:nth-child(3n) { border-right: 0; }
      }
    </style>
  </head>
  <body>
    <div data-preview-model="product-manager">
      <header class="top-user-bar">
        <div class="brand-lockup">
          <div class="brand-mark">优</div>
          <div class="brand-copy"><strong>优联信科</strong><span>产品经理确认预览</span></div>
        </div>
        <div class="user-summary"><span id="user-role">产品经理</span><div class="user-avatar" id="user-avatar">产</div></div>
      </header>

      <section class="application-primary-nav">
        <div class="application-identity">
          <div class="application-logo" id="application-logo">应</div>
          <div><strong id="application-name">待确认应用</strong><span id="application-summary">请根据结构表补充应用目标</span></div>
          <span class="tier-tag" id="application-tier">Basic</span>
        </div>
        <div class="application-actions"><button class="header-action" type="button">产品确认预览</button><button class="header-action" type="button">结构待确认</button></div>
      </section>

      <nav class="application-secondary-nav" aria-label="应用二级导航">
        <button class="module-select" id="module-select" type="button" aria-label="切换 Module"></button>
        <div class="tab-list" id="tab-list" role="tablist"></div>
      </nav>

      <main class="page-canvas">
        <section class="update-action-row">
          <div class="page-context"><h1 id="page-title">待确认页面</h1><p id="page-goal">请填写页面目标和主要用户任务</p></div>
          <div class="toolbar-actions"><button class="secondary-button" type="button" data-preview-action="detail">查看详情</button><button class="primary-button" type="button" data-preview-action="form">新建 / 编辑</button></div>
        </section>
        <section class="metric-strip" id="metric-strip"></section>
        <section class="query-toolbar"><div class="filter-list" id="filter-list"></div><div class="search-placeholder" id="search-placeholder">搜索待确认</div></section>
        <section class="content-surface">
          <div class="record-surface"><div class="record-head"><span id="primary-column-label">核心字段</span><span>状态</span><span>责任范围</span><span>更新时间</span><span>操作</span></div><div id="record-list"></div></div>
          <aside class="context-panel"><h2>页面结构摘要</h2><p id="page-mode">标准记录页</p><div class="field-list" id="field-list"></div><h2 style="margin-top: 20px;">待确认项</h2><ul class="pending-list" id="pending-list"></ul></aside>
        </section>
      </main>
    </div>

    <div class="preview-overlay" id="preview-overlay" hidden>
      <section class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header class="dialog-head"><h2 id="dialog-title">详情预览</h2><button class="close-button" type="button" data-preview-close aria-label="关闭">×</button></header>
        <div class="dialog-body" id="dialog-body"></div>
        <footer class="dialog-foot"><button class="secondary-button" type="button" data-preview-close>取消</button><button class="primary-button" type="button" data-preview-close>确认</button></footer>
      </section>
    </div>

    <script>
      // Codex 仅替换这个对象中的已确认业务信息；未知内容保持“待确认”。
      window.__PRODUCT_MANAGER_PREVIEW__ = {
        application: {
          name: "待确认应用",
          applicationId: "application-id",
          tier: "Basic",
          summary: "请根据产品经理应用结构表补充应用目标。"
        },
        currentUser: { name: "产品经理", role: "需求确认" },
        modules: [
          {
            id: "module-pending",
            label: "待确认 Module",
            tabs: [
              {
                id: "tab-pending",
                label: "待确认页面",
                page: {
                  title: "待确认页面",
                  goal: "请填写用户在此页面要完成的工作。",
                  mode: "标准记录页",
                  metrics: [{ label: "记录总数", value: "待确认" }],
                  filters: ["排序方式", "状态"],
                  fields: ["核心字段待确认"],
                  pending: ["请补充 Module、Tab、字段和主要动作。"],
                  rows: [{ primary: "待确认记录", status: "待确认", scope: "待确认", updatedAt: "待确认" }]
                }
              }
            ]
          }
        ]
      };

      const model = window.__PRODUCT_MANAGER_PREVIEW__;
      const state = { moduleId: model.modules[0].id, tabId: model.modules[0].tabs[0].id };
      const byId = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value ?? "待确认").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
      const currentModule = () => model.modules.find((module) => module.id === state.moduleId) || model.modules[0];
      const currentTab = () => currentModule().tabs.find((tab) => tab.id === state.tabId) || currentModule().tabs[0];
      const currentPage = () => currentTab().page || {};

      function renderTabs() {
        const module = currentModule();
        const moduleSelect = byId("module-select");
        moduleSelect.textContent = module.label;
        moduleSelect.setAttribute("data-module-id", module.id);
        const tabList = byId("tab-list");
        tabList.replaceChildren();
        module.tabs.forEach((tab) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "tab-button";
          button.setAttribute("role", "tab");
          button.setAttribute("data-tab-id", tab.id);
          button.setAttribute("aria-selected", String(tab.id === state.tabId));
          button.textContent = tab.label;
          button.addEventListener("click", () => { state.tabId = tab.id; render(); });
          tabList.append(button);
        });
      }

      function renderPage() {
        const page = currentPage();
        byId("page-title").textContent = page.title || currentTab().label;
        byId("page-goal").textContent = page.goal || "待确认";
        byId("page-mode").textContent = `页面模式：${page.mode || "待确认"}`;
        byId("primary-column-label").textContent = (page.fields || ["核心字段"]).at(0) || "核心字段";
        byId("search-placeholder").textContent = page.searchPlaceholder || "搜索待确认";

        const metrics = (page.metrics || []).slice(0, 6);
        byId("metric-strip").innerHTML = metrics.map((metric) => `<div class="metric-item"><span class="metric-label">${escapeHtml(metric.label)}</span><strong class="metric-value">${escapeHtml(metric.value)}</strong></div>`).join("");
        const filters = page.filters || [];
        byId("filter-list").innerHTML = filters.map((filter) => `<span class="filter-chip">${escapeHtml(filter)}</span>`).join("");
        const fields = page.fields || [];
        byId("field-list").innerHTML = fields.map((field) => `<span class="field-chip">${escapeHtml(field)}</span>`).join("");
        const pending = page.pending || ["待确认"];
        byId("pending-list").innerHTML = pending.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
        const rows = page.rows || [];
        byId("record-list").innerHTML = rows.map((row) => `<div class="record-row"><strong>${escapeHtml(row.primary)}</strong><span class="status-dot">${escapeHtml(row.status)}</span><span>${escapeHtml(row.scope)}</span><span>${escapeHtml(row.updatedAt)}</span><span>查看</span></div>`).join("");
      }

      function render() {
        const application = model.application || {};
        byId("application-name").textContent = application.name || "待确认应用";
        byId("application-summary").textContent = application.summary || "待确认";
        byId("application-tier").textContent = application.tier || "待确认";
        byId("user-role").textContent = (model.currentUser || {}).role || "产品经理";
        byId("user-avatar").textContent = ((model.currentUser || {}).name || "产").slice(0, 1);
        renderTabs();
        renderPage();
      }

      function openPreview(kind) {
        const page = currentPage();
        byId("dialog-title").textContent = kind === "detail" ? "详情预览" : "新建 / 编辑预览";
        byId("dialog-body").innerHTML = kind === "detail"
          ? `<p>此处用于确认详情层级、字段和业务动作。</p><div class="field-list">${(page.fields || ["待确认"]).map((field) => `<span class="field-chip">${escapeHtml(field)}</span>`).join("")}</div>`
          : `<p>此处用于确认表单字段、参与角色和成功后的业务结果。</p><div class="field-list">${(page.pending || ["待确认"]).map((item) => `<span class="field-chip">${escapeHtml(item)}</span>`).join("")}</div>`;
        byId("preview-overlay").hidden = false;
      }

      byId("module-select").addEventListener("click", () => {
        const currentIndex = model.modules.findIndex((module) => module.id === state.moduleId);
        const next = model.modules[(currentIndex + 1) % model.modules.length];
        state.moduleId = next.id;
        state.tabId = next.tabs[0].id;
        render();
      });
      document.querySelector('[data-preview-action="detail"]').addEventListener("click", () => openPreview("detail"));
      document.querySelector('[data-preview-action="form"]').addEventListener("click", () => openPreview("form"));
      document.querySelectorAll("[data-preview-close]").forEach((button) => button.addEventListener("click", () => { byId("preview-overlay").hidden = true; }));
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") byId("preview-overlay").hidden = true; });
      render();
    </script>
  </body>
</html>
